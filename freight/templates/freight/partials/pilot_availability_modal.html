{% load i18n %}
<div class="modal fade" id="pilot_availability_modal" tabindex="-1" aria-labelledby="pilot_availability_title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <form id="pilot_custom_availability_form" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="pilot_availability_title"><i class="far fa-clock me-2" aria-hidden="true"></i>{% translate "Online until" %}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'Close' %}"></button>
            </div>
            <div class="modal-body">
                <p class="text-body-secondary mb-3">{% translate "Choose when your shift ends. You’ll automatically go offline at that time." %}</p>
                <div class="rounded border p-3 mb-4">
                    <div class="small text-body-secondary mb-2">{% translate "Current time" %}</div>
                    <div class="row g-2">
                        <div class="col-6"><div class="small text-body-secondary">{% translate "EVE time (UTC)" %}</div><strong data-pilot-now-eve></strong></div>
                        <div class="col-6"><div class="small text-body-secondary">{% translate "Local time" %} <span data-pilot-zone></span></div><strong data-pilot-now-local></strong></div>
                    </div>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="end_mode" id="pilot_mode_duration" value="duration" checked>
                    <label class="form-check-label fw-semibold" for="pilot_mode_duration">{% translate "For a duration" %}</label>
                </div>
                <fieldset id="pilot_duration_fields" class="row g-3 ms-3 mb-4">
                    <div class="col-6"><label class="form-label" for="pilot_hours">{% translate "Hours" %}</label><input id="pilot_hours" class="form-control" type="number" min="0" step="1" value="1"></div>
                    <div class="col-6"><label class="form-label" for="pilot_minutes">{% translate "Minutes" %}</label><input id="pilot_minutes" class="form-control" type="number" min="0" max="59" step="1" value="0"></div>
                </fieldset>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="end_mode" id="pilot_mode_until" value="until">
                    <label class="form-check-label fw-semibold" for="pilot_mode_until">{% translate "Until a specific time" %}</label>
                </div>
                <fieldset id="pilot_until_fields" class="row g-3 ms-3 mb-4 d-none" disabled>
                    <div class="col-12"><label class="form-label" for="pilot_until_eve">{% translate "EVE time (UTC)" %}</label><input id="pilot_until_eve" class="form-control" type="datetime-local" step="60"></div>
                    <div class="col-12"><label class="form-label" for="pilot_until_local">{% translate "Local time" %} <span data-pilot-zone></span></label><input id="pilot_until_local" class="form-control" type="datetime-local" step="60"></div>
                </fieldset>
                <div class="border-start border-3 border-success ps-3" aria-live="polite">
                    <div class="fw-semibold mb-1">{% translate "Online until" %}</div>
                    <div><span data-pilot-preview-eve></span> <span class="text-body-secondary small">EVE</span></div>
                    <div><span data-pilot-preview-local></span> <span class="text-body-secondary small">{% translate "local" %}</span></div>
                </div>
                <div data-pilot-custom-error class="alert alert-danger mt-3 mb-0 d-none" role="alert"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% translate "Cancel" %}</button>
                <button data-pilot-custom-submit type="submit" class="btn btn-success"><i class="fas fa-check me-2" aria-hidden="true"></i>{% translate "Go online" %}</button>
            </div>
        </form>
    </div>
</div>
